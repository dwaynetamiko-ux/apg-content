name: Render videos

on:
  push:
    branches: [main]
    paths: ["scripts/**.json", "render/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q pillow numpy edge-tts

      - name: Decrypt licensed music and app recordings
        env:
          MUSIC_KEY: ${{ secrets.MUSIC_KEY }}
        run: |
          mkdir -p music_dec
          if [ -n "$MUSIC_KEY" ]; then
            for f in music/*.enc; do
              openssl enc -d -aes-256-cbc -pbkdf2 -in "$f" -out "music_dec/$(basename "$f" .enc)" -pass env:MUSIC_KEY
            done
            mkdir -p clips_dec
            for f in clips/*.enc; do
              openssl enc -d -aes-256-cbc -pbkdf2 -in "$f" -out "clips_dec/$(basename "$f" .enc)" -pass env:MUSIC_KEY
            done
          else
            echo "MUSIC_KEY secret not set - library tracks unavailable"
          fi

      - name: List available voices
        run: edge-tts --list-voices > render/voices.txt || true

      - name: Render any script without a video
        run: |
          set -e
          changed=$(git diff --name-only "${{ github.event.before || 'HEAD~1' }}" HEAD 2>/dev/null || true)
          for s in scripts/*.json; do
            name=$(basename "$s" .json)
            if [ ! -f "videos/$name.mp4" ] || echo "$changed" | grep -qx "$s"; then
              echo "Rendering $name"
              python render/render.py "$s" "videos/$name.mp4"
            fi
          done

      - name: Commit videos
        run: |
          git config user.name "apg-render-bot"
          git config user.email "actions@github.com"
          git add videos/ render/voices.txt
          git diff --cached --quiet || git commit -m "Render videos [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
